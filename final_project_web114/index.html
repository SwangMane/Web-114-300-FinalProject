<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Final project WEB-114 | Skill game</title>
    <link rel="stylesheet" href="game.css">
    <!-- Will only work on Desktop | hiding gameWrapper if screen < 1600px -->

    <!-- i'm really bad at UI so this will not look pretty. But should have everything needed assignment wise -->
  </head>
  <body>
    <h1 id="continuousTitle">Scholar Arena</h1>
    <!-- heads or tails wrapper -->
    <div id="popupWrapper" class="flexed">
      <div id="headsOrTailsWrap" class="popupWrap">
        <h1 id="hortSaying"></h1>
        <div id="coinDiv"></div>
        <div id="hortBtnWrap" class="flexed">
          <button id="headsBtn">Heads</button>
          <button id="tailsBtn">Tails</button>
        </div>
      </div>
      <div id="gameOverWrap" class="popupWrap">
        <h1>Game over</h1>
        <button id="reloadPage" onclick="window.location.reload();">Restart Game</button> <!-- last button seen on screen | reloads page -->
      </div>
    </div>
    <div id="gameWrapper">
    <!-- player area -->
      <div id="playerWrap" class="colWrap charWrap flexed">
        <div class="charName" id="playerName"></div>  
        <div class="charIcon flexed" id="playerIcon"></div>
        <div class="actionWrap">
          <div class="actionBtnWrap flexed"><button class="actionBtn playerBtns" id="player_dmgBtn" disabled>Damage</button><p class="statNumber flexed" id="player_dmgNmbr"></p></div>
          <div class="actionBtnWrap flexed"><button class="actionBtn playerBtns" id="player_blockBtn" disabled>Block</button><p class="statNumber flexed" id="player_blkNmbr"></p></div>  <!-- starting all buttons disabled -->
          <div class="actionBtnWrap flexed"><button class="actionBtn playerBtns" id="player_healBtn" disabled>Heal</button><p class="statNumber flexed" id="player_healNmbr"></p></div>
        </div>
      </div>
    <!-- logs area -->
      <div id="logWrap" class="colWrap flexed">
        <div id="logWrapIn" class="flexed">
          <h1 class="flexed">Game Logs</h1>
          <div id="logs">
            <button id="startGame">Start game</button>
          </div>
        </div>
      </div>
    <!-- enemy area -->
      <div id="enemyWrap" class="colWrap charWrap flexed">
        <div class="charName" id="enemyName"></div> 
        <div class="charIcon flexed" id="enemyIcon"></div>
        <div class="actionWrap">
          <div class="actionBtnWrap flexed"><button class="actionBtn" id="enemy_dmgBtn" disabled>Damage</button><p class="statNumber flexed" id="enemy_dmgNmbr"></p></div>
          <div class="actionBtnWrap flexed"><button class="actionBtn" id="enemy_blockBtn" disabled>Block</button><p class="statNumber flexed" id="enemy_blkNmbr"></p></div>   <!-- these buttons will never be actually clickable -->
          <div class="actionBtnWrap flexed"><button class="actionBtn" id="enemy_healBtn" disabled>Heal</button><p class="statNumber flexed" id="enemy_healNmbr"></p></div>    <!-- just to keep a uniform look -->
        </div>
      </div>
    <!-- --- -->
    </div>
  </body>
  <script src="game.js" type="module"></script>
</html>
