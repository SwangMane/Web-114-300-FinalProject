<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Final project WEB-114 | Skill game</title>
  <!-- MAIN STYLE SHEET | Did not see requirements for it to be seperate file so keeping it inline -->
  <!-- Will only work on Desktop | hiding gameWrapper if screen < 1600px -->

  <!-- i'm really bad at UI so this will not look pretty. But should have everything needed assignment wise -->
    <style>

      /*
      color palette

      #919599 - gray
      #CDCDCB - light gray
      #F8F8F8 - white-ist
      #FBA45C = light orange
      #E56515 - orange

      */

      html, body {
        width: 100%;
        height: 100%;

        overflow: hidden;

        padding: 0;
        margin: 0;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;

        background: #919599;
      }
      #gameWrapper {
        width: 1400px;
        aspect-ratio: 16 / 9;

        display: flex;
        justify-content: space-evenly;
        align-items: center;

        background: #CDCDCB;
      /* I do CSS battles (https://cssbattle.dev/ if you have not tried it) a ton, I know how to do these tricks this is not AI */
        box-shadow: 0 0 8px 12px rgb(0, 0, 0, 0.25),
                    inset 0 0 4px 4px #E56515;
      }
      .colWrap {
        height: 90%;

        background: #FBA45C;

        box-shadow: 0 0 4px 2px rgb(0, 0, 0, 0.25);

        border: 1px solid #E56515;

        padding: 12px;
        box-sizing: border-box;

        flex-direction: column;

        border-radius: 4px;
      }
      .charWrap {
        width: 30%;

        flex-direction: column;
      }
      .charName {
        width: 100%;
        height: 20%;

        overflow-x: auto;

        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
  /* going to let names overflow x if needed */
      .charName h1 {
        padding: 4px 24px;
        margin: 0;

        width: auto;
        height: auto;

        overflow-x: auto;
        overflow-y: hidden;

        font-size: 2rem;

        border-radius: 8px;

        display: flex;
        justify-content: center;
        align-items: flex-start;

        text-decoration: underline;
      }
      .charIcon {
        width: 100%;
        height: 80%;

        position: relative;

        font-size: 8rem;

        background: #F8F8F8;
        margin-bottom: auto;

        box-sizing: border-box;

        box-shadow: 0 0 2px 2px rgb(0, 0, 0, 0.25),
                    inset 0 0 2px 2px #F8F8F8,
                    inset 0 0 4px 4px #919599;
      }
      .currCharNumber {
        padding: 0;
        margin: 0;

        font-size: 1rem;
      }
      .currCharNumbersWrap {
        position: absolute;

        bottom: 16px;
      }
      .actionWrap {
        width: 100%;
        height: 100%;

        display: flex;
        justify-content: space-evenly;
        align-items: center;

        background: #919599;

        box-sizing: border-box;

        box-shadow: 0 0 2px 2px rgb(0, 0, 0, 0.25),
                    inset 0 0 2px 2px #919599,
                    inset 0 0 4px 4px #F8F8F8;

        flex-direction: column;

        padding: 16px;
      }
    /* middle of the screen log area */
      #logWrap {
        width: 20%;
      }
      #logWrapIn {
        flex-direction: column;

        width: 100%;
        height: 100%;;

        background: #F8F8F8;

        box-shadow: 0 0 2px 2px rgb(0, 0, 0, 0.25),
                    inset 0 0 1px 1px black,
                    inset 0 0 1px 4px white,
                    inset 0 0 1px 6px black;  
                    
        padding: 16px; 
        
        box-sizing: border-box;
      }
    /* "Game Logs" heading */
      #logWrap h1 {
        height: 10%;
        width: 100%;

        text-decoration: underline;

        background: #919599;

        border: 1px solid black;
        border-radius: 4px;

        box-shadow: 0 0 2px 2px rgb(0, 0, 0, 0.25);

        box-sizing: border-box;

        margin: 0;
        padding: 0;
      }
    /* middle of the screen log area */
      #logs {
        width: 100%;
        height: 90%;

        display: flex;
        align-items: center;
        justify-content: flex-start;

        flex-direction: column;

        padding: 24px 4px;

        box-sizing: border-box;

        gap: 10px;

        white-space: wrap;

        font-size: 1.25rem;

        overflow-y: auto;
        overflow-x: hidden;
      }
      #logs p {
        margin: 0;
        padding: 4px 2px;

        white-space: wrap;

        box-sizing: border-box;

        width: 100%;
        height: auto;

        box-shadow: 0 0 1px 2px rgb(0, 0, 0, 0.25);

        background: rgb(0, 0, 0, 0.05);
        border-radius: 5%;

        border-bottom: 1px solid black;
        border-bottom-width: 75%;
      }
    /* player / enemy action button wraps */
      .actionBtnWrap {
        width: 100%;
        height: 30%;

        border: 1px solid black;
      }
      .actionBtnWrap p {
        padding: 0;
        margin: 0;

        font-size: 1.5rem;
      }
    /* player / enemy action buttons (damage | block | heal) */
      .actionBtn {
        width: 50%;
        height: 100%;

        background: #FBA45C;

        font-size: 2rem;
      }
    /* player / enemy stat numbers */
      .statNumber {
        width: 50%;
        height: 100%;

        box-shadow: inset 0 0 1px 1px black,
            inset 0 0 1px 4px white,
            inset 0 0 1px 6px black,
            inset 0 0 15px 10px rgb(0, 0, 0, 0.5);

        font-weight: bold;
        font-size: 1.25rem;
        text-decoration: underline;

        background: #F8F8F8;
      }
      #startGame {
        width: 100%;
        height: 100%;

        white-space: wrap;

        font-size: 4rem;
      }
      #popupWrapper {
        display: none;
        opacity: 0;

        width: 100%;
        height: 100%;

        background: rgb(0, 0, 0, 0.5);

        animation: fadeIn 1s forwards;

        position: absolute;

        z-index: 1000;

        margin: 0;
        padding: 0;
      }
      .popupWrap {
        width: 720px;
        aspect-ratio: 4 / 3;

        border: 1px solid black;
        border-radius: 8px;

        margin: 0;
        padding: 16px;

        box-sizing: border-box;

        justify-content: center;
        align-items: center;

        box-shadow: 0 0 2px 4px rgb(0, 0, 0, 0.5);

        background: #FBA45C;

        flex-direction: column;

        display: none;
      }
      #hortBtnWrap {
        width: 100%;
        height: 25%;

        box-shadow: inset 0 0 1px 1px black,
                    inset 0 0 3px 3px white,
                    inset 0 0 5px 5px black;

        justify-content: space-evenly;

        box-sizing: border-box;

        padding: 16px;

        gap: 16px;
      }
      #hortBtnWrap button {
        width: 100%;
        height: 100%;

        font-size: 3rem;
      }
      #hortBtnWrap button:hover {
        box-shadow: 0 0 1px 2px rgb(0, 0, 0, 0.5),
                    inset 0 0 3px 5px rgb(0, 0, 0, 0.35);
      }
      .buttonActive {
        box-shadow: 0 0 1px 2px rgb(0, 0, 0, 0.5),
            inset 0 0 3px 5px rgb(0, 0, 0, 0.35);

        background: rgb(0, 255, 0, 0.25);
      }
      #hortSaying {
        width: 100%;
        height: 25%;

        font-size: 1.8rem;

        box-sizing: border-box;

        overflow: hidden;

        padding: 16px 10px;

        background: #F8F8F8;

        box-shadow: 0 0 1px 1px black,
                    inset 0 0 4px 1px #FBA45C,
                    inset 0 0 10px 4px rgb(0, 0, 0, 0.5);

        white-space: wrap;
      }
      #coinDiv {
        width: 100%;
        height: 50%;

        display: flex;
        justify-content: center;
        align-items:flex-start;
      }
      .actualCoin {
        background: gold;
        border-radius: 50%;
        width: 30%;
        aspect-ratio: 1 / 1;

        display: flex;
        justify-content: center;
        align-items: center;

        box-sizing: border-box;
        box-shadow: 0 0 4px 6px rgb(0, 0, 0, 0.35);

        font-size: 2.5rem;
        text-shadow: 0 0 1px 1px black;
      }
    /* add to containers needing flexed */
      .flexed {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      @keyframes fadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      @media (max-width: 1280px) {
        #gameWrapper {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="popupWrapper" class="flexed">
      <div id="headsOrTailsWrap" class="popupWrap">
        <h1 id="hortSaying"></h1>
        <div id="coinDiv"></div>
        <div id="hortBtnWrap" class="flexed">
          <button id="headsBtn">Heads</button>
          <button id="tailsBtn">Tails</button>
        </div>

      </div>
    </div>
    <div id="gameWrapper">
    <!-- player area -->
      <div id="playerWrap" class="colWrap charWrap flexed">
        <div class="charName" id="playerName"></div>  
        <div class="charIcon flexed" id="playerIcon"></div>
        <div class="actionWrap">
          <div class="actionBtnWrap flexed"><button class="actionBtn playerBtns" id="player_dmgBtn" disabled>Damage</button><p class="statNumber flexed" id="player_dmgNmbr"></p></div>
          <div class="actionBtnWrap flexed"><button class="actionBtn playerBtns" id="player_blockBtn" disabled>Block</button><p class="statNumber flexed" id="player_blkNmbr"></p></div>  <!-- starting all buttons disabled -->
          <div class="actionBtnWrap flexed"><button class="actionBtn playerBtns" id="player_healBtn" disabled>Heal</button><p class="statNumber flexed" id="player_healNmbr"></p></div>
        </div>
      </div>
    <!-- logs area -->
      <div id="logWrap" class="colWrap flexed">
        <div id="logWrapIn" class="flexed">
          <h1 class="flexed">Game Logs</h1>
          <div id="logs">
            <button id="startGame">Start game</button>
          </div>
        </div>
      </div>
    <!-- enemy area -->
      <div id="enemyWrap" class="colWrap charWrap flexed">
        <div class="charName" id="enemyName"></div> 
        <div class="charIcon flexed" id="enemyIcon"></div>
        <div class="actionWrap">
          <div class="actionBtnWrap flexed"><button class="actionBtn" id="enemy_dmgBtn" disabled>Damage</button><p class="statNumber flexed" id="enemy_dmgNmbr"></p></div>
          <div class="actionBtnWrap flexed"><button class="actionBtn" id="enemy_blockBtn" disabled>Block</button><p class="statNumber flexed" id="enemy_blkNmbr"></p></div>   <!-- these buttons will never be actually clickable -->
          <div class="actionBtnWrap flexed"><button class="actionBtn" id="enemy_healBtn" disabled>Heal</button><p class="statNumber flexed" id="enemy_healNmbr"></p></div>    <!-- just to keep a uniform look -->
        </div>
      </div>
    <!-- --- -->
    </div>
  </body>
  <script src="game.js" type="module"></script>
</html>
